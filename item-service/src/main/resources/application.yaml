server:
  port: 8081
spring:
  application:
    name: item-service
  profiles:
    active: rem
  datasource:
    url: jdbc:mysql://${rm.db.host}:3307/rm-item?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${rm.db.pw}
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.93.133:8848
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.rmall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 火玫商城商品服务接口文档
    description: "火玫商城商品服务接口文档"
    email: 1543760017@qq.com
    concat: rose
    url: https://www.firedrose.cn
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.rmall.item.controller
